spring:
  application:
    name: codecompass-backend

server:
  port: 8080

codecompass:
  service:
    version: 0.0.1-SNAPSHOT

  # 这是多语言架构的"那一份配置"：新增一门语言只在这里追加一项，
  # 克隆与扫描的代码都不用改。
  scan:
    sources:
      - language: java
        # 路径片段序列：出现在任意深度都算命中，同时充当包名推导的基准
        source-root: 'src/main/java'
        file-extensions: ['.java']
        excluded-file-names: ['package-info.java', 'module-info.java']

  # Java 分析器配置。框架标记刻意放这里而不是硬编码在代码里（T5 要求「应可配置」）。
  # 注意：YAML 里 '@' 是保留指示符，标记必须加引号。
  analyze:
    java:
      # 留空 = 取 JavaParser 支持的最高非 PREVIEW 级别。
      # 不要删掉这行的注释去填 JAVA_11 之类 —— JavaParser 的默认级别就是 JAVA_11，
      # 用它解析 record / sealed / switch 表达式会整批失败（实测）。
      language-level:
    framework-markers:
      spring:
        - '@SpringBootApplication'
        - '@RestController'
        - '@Controller'
        - '@Service'
        - '@Repository'
        - '@Component'
        - '@Configuration'
        - '@Bean'
        - '@Autowired'

  clone:
    # git 可执行文件。默认 "git"，依赖 PATH。
    git-executable: git
    # temp-root 不在此处写死：默认取 ${java.io.tmpdir}/codecompass，跨平台自适应。

    # 整个克隆流程（4 条 git 命令）的总预算，不是每条命令各自的超时。
    timeout: 60s

    # 额外的稀疏检出模式：非源码文件（构建信息）。
    # 源码范围不在这里配 —— 由上面的 scan.sources[].source-root 派生为 **/<source-root>/**，
    # 避免"检出范围"与"扫描范围"漂移。
    extra-path-patterns:
      - pom.xml
      - '**/pom.xml'

    # 三项限制均按落盘量计（.git + 已检出工作区）。
    # 因为用 --filter=blob:none + 稀疏检出，仓库的真实大小与真实文件总数拿不到。
    limits:
      # 看门狗动态中止阈值：500 MiB 的 1.2 倍，留误杀余量
      watchdog-bytes: 629145600
      watchdog-interval: 2s
      # 克隆成功后的终检
      max-repo-bytes: 524288000
      max-file-bytes: 20971520
      max-files: 1000
