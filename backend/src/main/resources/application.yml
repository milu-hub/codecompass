spring:
  application:
    name: codecompass-backend

  # T13：持久化。连接串从环境变量读（不硬编码）；缺省回落 H2（单元测试/无库开发）。
  # 集成/生产：DB_URL=jdbc:mysql://127.0.0.1:3306/codecompass?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
  datasource:
    url: ${DB_URL:jdbc:h2:mem:codecompass;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # schema 归 Flyway 管，Hibernate 不许动 —— 缺省 create-drop 会把迁移出的表清掉
      ddl-auto: none
    open-in-view: false

server:
  port: 8080

codecompass:
  service:
    version: 0.0.1-SNAPSHOT

  # 这是多语言架构的"那一份配置"：新增一门语言只在这里追加一项，
  # 克隆与扫描的代码都不用改。
  scan:
    sources:
      - language: java
        # 路径片段序列：出现在任意深度都算命中，同时充当包名推导的基准
        source-root: 'src/main/java'
        file-extensions: ['.java']
        excluded-file-names: ['package-info.java', 'module-info.java']

  # Java 分析器配置。框架标记刻意放这里而不是硬编码在代码里（T5 要求「应可配置」）。
  # 注意：YAML 里 '@' 是保留指示符，标记必须加引号。
  analyze:
    java:
      # 留空 = 取 JavaParser 支持的最高非 PREVIEW 级别。
      # 不要删掉这行的注释去填 JAVA_11 之类 —— JavaParser 的默认级别就是 JAVA_11，
      # 用它解析 record / sealed / switch 表达式会整批失败（实测）。
      language-level:
    framework-markers:
      spring:
        - '@SpringBootApplication'
        - '@RestController'
        - '@Controller'
        - '@Service'
        - '@Repository'
        - '@Component'
        - '@Configuration'
        - '@Autowired'
        - '@Bean'

    # 核心注解 → 角色。这是 T5「注解列表可配置」的实质载体。
    # 与 framework-markers 语义不同，刻意分开：前者回答「仓库是不是 Spring」，
    # 这里回答「这个类扮演什么角色」。启动时会校验两者的一致性并在漂移时告警。
    #
    # 角色按声明顺序取第一个命中者，因此决定性的角色（entry）写在前面。
    # 名为 member 的角色是保留字：声明成员级（字段/方法）注解，不参与类级角色判定。
    core-annotations:
      spring:
        entry:
          - '@SpringBootApplication'
        controller:
          - '@Controller'
          - '@RestController'
        service:
          - '@Service'
        repository:
          - '@Repository'
        component:
          - '@Component'
          - '@Configuration'
        member:
          - '@Autowired'
          - '@Bean'

  clone:
    # git 可执行文件。默认 "git"，依赖 PATH。
    git-executable: git
    # temp-root 不在此处写死：默认取 ${java.io.tmpdir}/codecompass，跨平台自适应。

    # 整个克隆流程（4 条 git 命令）的总预算，不是每条命令各自的超时。
    timeout: 60s

    # 额外的稀疏检出模式：非源码文件（构建信息）。
    # 源码范围不在这里配 —— 由上面的 scan.sources[].source-root 派生为 **/<source-root>/**，
    # 避免"检出范围"与"扫描范围"漂移。
    extra-path-patterns:
      - pom.xml
      - '**/pom.xml'

    # 三项限制均按落盘量计（.git + 已检出工作区）。
    # 因为用 --filter=blob:none + 稀疏检出，仓库的真实大小与真实文件总数拿不到。
    limits:
      # 看门狗动态中止阈值：500 MiB 的 1.2 倍，留误杀余量
      watchdog-bytes: 629145600
      watchdog-interval: 2s
      # 克隆成功后的终检
      max-repo-bytes: 524288000
      max-file-bytes: 20971520
      max-files: 1000

  # T10：LLM 问答。api-key 留空 = 未配置，/ask 返回 502（绝不 500）。
  # 端点走 OpenAI 兼容协议，换 provider 只改配置不改代码。
  # provider 是元数据标签（随 LlmConfig 模型透出），MVP 不参与路由。
  llm:
    provider: openai
    base-url: https://api.openai.com/v1
    api-key: ${CODESCOMPASS_LLM_API_KEY:}
    model: gpt-4o-mini
    timeout: 60s
    max-attempts: 3

  # T11：问答缓存与限流。T13 起缓存默认落 MySQL（MysqlCacheService，见 SCHEMA_F2_F6.md
  # 的 cache_entries）；storage=memory 切回内存版。缓存只存问答结果，不存仓库代码。
  cache:
    storage: mysql
    ttl: 1h
    max-size: 500   # 仅内存实现使用（容量上限）；MySQL 实现按 TTL 惰性清理，容量语义延后
  rate-limit:
    # 按匿名身份（X-Client-Id → X-Forwarded-For → IP）的自然日 token 上限
    daily-token-limit: 100000

  # T19：成就规则全部在配置里（服务端按 user_actions 计数判定，>= threshold 解锁）
  achievements:
    definitions:
      - code: FIRST_REPO
        name: 初次探索
        description: 完成第一个仓库分析
        action: analyze
        threshold: 1
      - code: FIRST_NOTE
        name: 第一笔笔记
        description: 写下第一条笔记
        action: note
        threshold: 1
      - code: TEN_QUESTIONS
        name: 刨根问底
        description: 提问 10 次
        action: ask
        threshold: 10
      - code: QUIZ_MASTER
        name: 满分学霸
        description: 一次测验正确率 100%
        action: quiz_perfect
        threshold: 1
      - code: PATH_FINISHED
        name: 善始善终
        description: 完成一条学习路线
        action: path_done
        threshold: 1

  # T21：分享快照过期天数
  share:
    expires-days: 30
