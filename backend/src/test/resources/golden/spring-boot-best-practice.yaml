# TASKBOOK §03 要求：任选 5 个类的功能描述
# ⚠️ 以下描述由 AI 依源码草拟，**尚待人工确认** —— TASKBOOK 要求的是"手工标注"。
classDescriptions:
  - name: cn.javastack.springboot.quickstart.Application
    description: 快速入门示例的应用入口，同时标注 @SpringBootApplication 与 @RestController，提供 /hello 端点直接返回字符串，是「最简 Spring Boot 应用」的教学范本。
  - name: cn.javastack.springboot.mybatis.controller.UserController
    description: MyBatis 模块的用户控制器（@RestController）。通过构造器注入 UserMapper，/user/info/{id} 按 id 查询用户并返回 UserDO 实体。
  - name: cn.javastack.springboot.jpa.controller.UserController
    description: JPA 模块的用户控制器（@RestController）。通过构造器注入继承 CrudRepository 的 UserRepository，按 id 查询用户并返回 UserDO 实体 —— 与 mybatis 模块同名类形成跨模块对照。
  - name: cn.javastack.springboot.starter.config.TestServiceAutoConfiguration
    description: 自定义 starter 的自动配置类（@AutoConfiguration），受 javastack.starter.enabled 属性开关控制，向容器注册 TestService Bean —— 展示 Spring Boot 3 自动装配新写法。
  - name: cn.javastack.springboot.starter.service.TestService
    description: 自定义 starter 提供的服务类，getServiceName() 返回固定名称；被 starter-sample 模块的 Application 以 @Bean 参数方式消费 —— 跨模块依赖的典型用例。
